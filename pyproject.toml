[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-agent-orchestrator"
version = "1.0.0"
description = "Production-grade multi-agent AI orchestration platform (FastAPI + LangGraph + PostgreSQL + Redis)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Platform Engineering" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "redis>=5.0",
    "langgraph>=0.2",
    "openai>=1.40",
    "pyjwt>=2.8",
    "cryptography>=42.0",
    "prometheus-client>=0.20",
    "opentelemetry-sdk>=1.25",
    "opentelemetry-exporter-otlp-proto-http>=1.25",
    "structlog>=24.1",
    "httpx>=0.27",
    "tenacity>=8.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "fakeredis>=2.23",
    "ruff>=0.5",
    "mypy>=1.10",
    "bandit>=1.7",
    "pip-audit>=2.7",
    "locust>=2.29",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "ASYNC", "S"]
ignore = ["S101", "S104", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "E501"]
"scripts/*" = ["S"]
"app/security/auth.py" = []
"tests/security/*" = ["S"]

[tool.mypy]
python_version = "3.11"
plugins = []
warn_unused_ignores = false
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
ignore_missing_imports = true
exclude = ["migrations/", "scripts/", "tests/load/", "build/", ".venv/"]

[[tool.mypy.overrides]]
module = ["tests.*", "migrations.*", "scripts.*"]
disallow_untyped_defs = false
check_untyped_defs = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"
markers = [
    "unit: fast isolated tests with fakes",
    "integration: tests requiring PostgreSQL and Redis",
    "e2e: end-to-end flow tests",
    "security: adversarial/authorization tests",
    "evaluation: AI evaluation suite",
]

[tool.coverage.run]
source = ["app"]
omit = ["app/main.py"]

[tool.bandit]
exclude_dirs = ["tests", ".venv", "scripts"]
